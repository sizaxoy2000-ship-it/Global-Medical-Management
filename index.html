<!DOCTYPE html>
<html id="htmlTag" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Siroz Elite Care | Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0a2342; --accent: #c5a059; --bg: #f8f9fa; }
        html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; background: var(--bg); font-family: 'Cairo', sans-serif; }
        * { box-sizing: border-box; }
        .container { width: 100%; padding: 10px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; position: relative; }
        .logo { font-size: 1.5rem; text-align: center; margin: 5px 0; color: var(--primary); font-weight: bold; }
        .logo span { color: var(--accent); }
        .subtitle { text-align: center; font-size: 0.7rem; color: #999; margin-bottom: 12px; }
        .grid-depts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .dept-card { background: #fdfdfd; padding: 10px 5px; border-radius: 12px; text-align: center; border: 1px solid #eee; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .dept-card.active { background: var(--primary); color: var(--accent); border-color: var(--primary); }
        input, textarea { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: 1px solid #eee; text-align: center; font-size: 0.9rem; outline: none; font-family: 'Cairo'; }
        textarea { height: 60px; resize: none; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; margin-top: 8px; }
        .table-area { width: 100%; overflow-x: auto; margin-top: 5px; border-radius: 10px; border: 1px solid #f0f0f0; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #f8f8f8; padding: 8px; font-size: 0.65rem; color: #aaa; text-align: right; }
        td { padding: 10px 8px; border-bottom: 1px solid #f9f9f9; font-size: 0.8rem; }
        .setup-screen { max-width: 400px; margin: 40px auto; display: none; }
        .search-box { background: #f0f4f8; border: 1px solid var(--accent); margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="setupPage" class="card setup-screen">
        <h1 class="logo">SIROZ <span>ELITE</span></h1>
        <p class="subtitle">قم بربط عيادتك لتبدأ العمل</p>
        <input type="text" id="clinicName" placeholder="اسم العيادة">
        <input type="tel" id="clinicWa" placeholder="رقم واتساب العيادة">
        <input type="text" id="scriptUrl" placeholder="رابط Google Script الخاص بك">
        <button class="btn btn-main" onclick="saveSettings()">بدء النظام الآمن</button>
    </div>

    <div id="mainSystem" style="display: none;">
        <div class="card">
            <h1 class="logo" id="displayClinicName">SIROZ</h1>
            <p class="subtitle">نظام الحجز الذكي</p>
            <div class="grid-depts">
                <div class="dept-card" onclick="selectDept('تجميل', this)">✨ تجميل</div>
                <div class="dept-card" onclick="selectDept('أسنان', this)">🦷 أسنان</div>
                <div class="dept-card" onclick="selectDept('زراعة الشعر', this)">🌱 زراعة شعر</div>
                <div class="dept-card" onclick="selectDept('صيدلية', this)">💊 صيدلية</div>
                <div class="dept-card" onclick="selectDept('مختبر', this)" style="grid-column: span 2;">🔬 مختبر</div>
            </div>
            <input type="text" id="pName" placeholder="اسم المراجع">
            <input type="tel" id="pPhone" placeholder="رقم الهاتف">
            <textarea id="pDesc" placeholder="وصف الحالة"></textarea>
            <button class="btn btn-main" onclick="confirmBooking()" style="background: var(--accent); color: var(--primary);">تأكيد وحفظ</button>
        </div>

        <div class="card">
            <h2 style="text-align: right; color: var(--accent); font-size: 0.9rem;">📊 سجل المراجعين</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث بالاسم..." onkeyup="searchPatient()">
            <div class="table-area">
                <table>
                    <thead><tr><th>المراجع</th><th>الهاتف</th><th>الوصف</th><th>التاريخ</th><th>فعل</th></tr></thead>
                    <tbody id="adminTableBody"></tbody>
                </table>
            </div>
            <button class="btn" onclick="resetSystem()" style="margin-top:10px; background:#eee; font-size:0.7rem;">⚙️ إعدادات الحساب</button>
        </div>
    </div>
</div>

<script>
    let currentDept = "";

    window.onload = function() {
        if(localStorage.getItem('siroz_link')) {
            document.getElementById('mainSystem').style.display = 'block';
            document.getElementById('displayClinicName').innerText = localStorage.getItem('siroz_clinic');
            loadAdminData();
        } else {
            document.getElementById('setupPage').style.display = 'block';
        }
    };

    function saveSettings() {
        const name = document.getElementById('clinicName').value;
        const wa = document.getElementById('clinicWa').value;
        const link = document.getElementById('scriptUrl').value;
        if(name && wa && link) {
            localStorage.setItem('siroz_clinic', name);
            localStorage.setItem('siroz_wa', wa);
            localStorage.setItem('siroz_link', link);
            location.reload();
        } else { alert("يرجى ملء جميع الخانات"); }
    }

    function selectDept(dept, el) {
        currentDept = dept;
        document.querySelectorAll('.dept-card').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
    }

    async function confirmBooking() {
        const name = document.getElementById('pName').value;
        const phone = document.getElementById('pPhone').value;
        const desc = document.getElementById('pDesc').value || "-";
        const link = localStorage.getItem('siroz_link');
        const wa = localStorage.getItem('siroz_wa');

        if(!name || !currentDept || !phone) return alert("اكمل البيانات");

        const date = new Date().toLocaleString('ar-EG');
        let rs = JSON.parse(localStorage.getItem('siroz_records') || '[]');
        rs.push({ id: Date.now(), name, phone, desc, dept: currentDept, date });
        localStorage.setItem('siroz_records', JSON.stringify(rs));

        // الإرسال للجدول الخاص بهذا المستخدم
        fetch(link, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ name, dept: currentDept, phone, desc, date }) });

        // رسالة الواتساب
        const msg = `*حجز جديد*%0A👤 الاسم: ${name}%0A🏥 القسم: ${currentDept}%0A📞 الهاتف: ${phone}%0A📅 التاريخ: ${date}`;
        window.open(`https://api.whatsapp.com/send?phone=${wa}&text=${msg}`, '_blank');
        
        loadAdminData();
    }

    function loadAdminData() {
        const rs = JSON.parse(localStorage.getItem('siroz_records') || '[]');
        const b = document.getElementById('adminTableBody');
        b.innerHTML = rs.slice().reverse().map(r => `<tr><td><b>${r.name}</b></td><td>${r.phone}</td><td><small>${r.desc}</small></td><td>${r.date}</td><td><button onclick="editRecord(${r.id})" style="border:none;background:none;">✏️</button></td></tr>`).join('') || "<tr><td colspan='5'>لا يوجد بيانات</td></tr>";
    }

    function searchPatient() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let rows = document.getElementById('adminTableBody').getElementsByTagName('tr');
        for (let i = 0; i < rows.length; i++) { rows[i].style.display = rows[i].innerText.toLowerCase().includes(input) ? "" : "none"; }
    }

    function editRecord(id) {
        let rs = JSON.parse(localStorage.getItem('siroz_records') || '[]');
        let i = rs.findIndex(r => r.id === id);
        let n = prompt("تعديل الاسم:", rs[i].name);
        if(n) { rs[i].name = n; localStorage.setItem('siroz_records', JSON.stringify(rs)); loadAdminData(); }
    }

    function resetSystem() { if(confirm("هل تريد مسح الإعدادات وربط رابط جديد؟")) { localStorage.removeItem('siroz_link'); location.reload(); } }
</script>
</body>
    </html>

<!DOCTYPE html>
<html id="htmlTag" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siroz Elite | Sky Medical Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* لوحة الألوان الجديدة: أزرق سماوي وأبيض */
            --sky-blue: #0091ea; /* أزرق سماوي حيوي */
            --light-sky: #e1f5fe; /* أزرق سماوي فاتح جداً للخلفية */
            --dark-blue: #01579b; /* أزرق داكن للنصوص */
            --glass-white: rgba(255, 255, 255, 0.9);
            --text-main: #263238;
            --white: #ffffff;
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--light-sky) 0%, #ffffff 100%);
            color: var(--text-main);
            margin: 0; padding: 15px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        /* حاوية الصفحة الزجاجية البيضاء */
        .page {
            display: none; width: 100%; max-width: 460px;
            background: var(--glass-white);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 40px 30px;
            border-radius: 40px;
            border: 1px solid rgba(0, 145, 234, 0.1);
            box-shadow: 0 20px 40px rgba(0, 145, 234, 0.08);
            position: relative;
        }

        .active { display: block; animation: fadeInUp 0.8s ease; }

        /* زر الترجمة السماوي */
        .lang-switcher {
            position: absolute; top: 20px; left: 20px;
            background: transparent; color: var(--sky-blue);
            padding: 5px 15px; border-radius: 20px;
            font-size: 0.75rem; cursor: pointer; border: 1.5px solid var(--sky-blue);
            font-weight: bold; transition: var(--transition);
        }
        .lang-switcher:hover { background: var(--sky-blue); color: var(--white); }

        .logo-font { font-family: 'Playfair Display', serif; color: var(--sky-blue); letter-spacing: 3px; margin: 0; }

        h2 { font-size: 1.4rem; text-align: center; margin-bottom: 30px; font-weight: 700; color: var(--dark-blue); }
        
        /* المدخلات البيضاء النظيفة */
        input, select {
            width: 100%; padding: 16px; margin: 12px 0;
            background: #f8fdff;
            border: 1.5px solid #e1f5fe;
            border-radius: 15px; outline: none; transition: var(--transition);
            font-size: 0.95rem; color: var(--text-main); text-align: center;
        }

        input:focus { border-color: var(--sky-blue); background: var(--white); box-shadow: 0 0 0 4px rgba(0, 145, 234, 0.05); }

        /* أزرار نوع الزيارة */
        .visit-type-container { display: flex; gap: 12px; margin: 20px 0; }
        .type-btn {
            flex: 1; padding: 12px; border: 1.5px solid #e1f5fe;
            border-radius: 12px; cursor: pointer; background: var(--white);
            font-size: 0.85rem; font-weight: bold; transition: var(--transition);
            text-align: center; color: var(--sky-blue);
        }
        .type-btn.active { background: var(--sky-blue); color: var(--white); border-color: var(--sky-blue); }

        .btn {
            width: 100%; padding: 18px; border: none; border-radius: 50px;
            font-weight: bold; font-size: 1rem; cursor: pointer; transition: var(--transition);
            margin-top: 15px; letter-spacing: 1px;
        }

        .btn-gold { background: var(--sky-blue); color: var(--white); }
        .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 145, 234, 0.2); }

        .btn-wa { background: #25d366; color: #fff; }

        /* الكروت السماوية الفاخرة */
        .card {
            background: var(--white);
            border: 1px solid #f0faff;
            padding: 20px; border-radius: 20px; margin-bottom: 15px;
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .card:hover { 
            background: #f0faff; 
            border-color: var(--sky-blue); 
            transform: translateY(-3px); 
            box-shadow: 0 8px 15px rgba(0, 145, 234, 0.08);
        }

        .icon-circle {
            width: 50px; height: 50px; background: var(--light-sky);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: var(--sky-blue);
        }

        /* سجل المراجعات */
        .history-section {
            margin-top: 30px; display: none; max-height: 200px; overflow-y: auto;
            background: #f8fdff; padding: 15px; border-radius: 20px; border: 1px solid #e1f5fe;
        }
        .history-item { font-size: 0.8rem; padding: 10px 0; border-bottom: 1px solid #e1f5fe; display: flex; justify-content: space-between; }

        .admin-footer { margin-top: 40px; display: flex; justify-content: center; gap: 30px; font-size: 0.75rem; color: var(--sky-blue); font-weight: bold; }
        .admin-footer span:hover { text-decoration: underline; cursor: pointer; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <button class="lang-switcher" onclick="toggleLanguage()" id="langBtn">English</button>

    <div id="setupPage" class="page">
        <div style="text-align:center; margin-bottom:30px;">
            <h1 class="logo-font">SIROZ</h1>
            <p style="font-size:0.7rem; letter-spacing:3px; color: var(--sky-blue); opacity:0.7;">ELITE MEDICAL CARE</p>
        </div>
        <h2 data-ar="إعدادات النظام الطبي ⚙️" data-en="Medical System Setup ⚙️">إعدادات النظام الطبي ⚙️</h2>
        <input type="text" id="clinicNameInput" placeholder="Name of Clinic / اسم العيادة">
        <input type="tel" id="whatsappInput" placeholder="WhatsApp (e.g. 964...)">
        <button class="btn btn-gold" onclick="saveAdminSettings()" data-ar="إطلاق النسخة السماوية 🚀" data-en="Launch Sky Edition 🚀">إطلاق النسخة السماوية 🚀</button>
    </div>

    <div id="bookingPage" class="page">
        <div style="text-align:center; margin-bottom:20px;">
            <h1 class="logo-font" style="font-size: 2rem;">SIROZ</h1>
            <p id="displayClinicName" style="color: var(--dark-blue); font-size: 0.9rem; font-weight: bold; letter-spacing: 1px;"></p>
        </div>
        
        <div id="cardsContainer"></div>

        <div id="patientArea" style="display: none; margin-top: 25px; animation: fadeInUp 0.5s ease;">
            <div style="background: #f0faff; padding: 20px; border-radius: 25px; border: 1.5px solid #e1f5fe;">
                <h4 id="selectedDeptName" style="color: var(--sky-blue); text-align: center; margin-bottom: 20px;"></h4>
                
                <p style="font-size: 0.8rem; text-align:center; font-weight: bold; color: var(--dark-blue);" data-ar="اختر نوع الزيارة" data-en="Choose Visit Type">نوع الزيارة</p>
                <div class="visit-type-container">
                    <div class="type-btn active" id="typeNew" onclick="setVisitType('أول مرة', 'New Visit', this)" data-ar="أول مرة" data-en="First Time">أول مرة</div>
                    <div class="type-btn" id="typeFollow" onclick="setVisitType('مراجعة شهرية', 'Monthly Review', this)" data-ar="مراجعة شهرية" data-en="Monthly Review">مراجعة شهرية</div>
                </div>

                <input type="text" id="pName" placeholder="Full Name">
                <input type="tel" id="pPhone" placeholder="Phone Number">
                <button class="btn btn-wa" onclick="sendToWhatsApp()" data-ar="تأكيد الحجز السماوي 🔵" data-en="Confirm Sky Booking 🔵">تأكيد الحجز السماوي 🔵</button>
            </div>
        </div>

        <div id="historySection" class="history-section">
            <h4 style="font-size: 0.85rem; color: var(--dark-blue); margin-bottom: 10px;" data-ar="سجل المراجعات" data-en="Review History">سجل المراجعات</h4>
            <div id="historyList"></div>
        </div>

        <div class="admin-footer">
            <span onclick="toggleHistory()" data-ar="📋 عرض السجل" data-en="📋 Records">📋 عرض السجل</span>
            <span onclick="resetApp()" data-ar="⚙️ الإعدادات" data-en="⚙️ Reset">⚙️ الإعدادات</span>
        </div>
    </div>

<script>
    /* ملاحظة سيبيل: البرمجة بقيت كما هي دون حذف أي حرف */
    let currentLang = 'ar';
    let activeDept = "";
    let visitTypeAr = "أول مرة";
    let visitTypeEn = "New Visit";

    const translations = {
        ar: {
            hair: "زراعة الشعر وتركيبه", skin: "الجلدية والتجميل", teeth: "ابتسامة هوليود", lab: "الفحص الشامل",
            placeholderName: "الاسم الكامل للمراجع", placeholderPhone: "رقم الهاتف", alertFill: "فضلاً، أكمل البيانات المطلوبة",
            waMsg: "*حجز طبي جديد - Siroz Elite*"
        },
        en: {
            hair: "Hair Restoration", skin: "Aesthetics & Skin", teeth: "Dental Design", lab: "Medical Check-up",
            placeholderName: "Patient Full Name", placeholderPhone: "Phone Number", alertFill: "Please complete details",
            waMsg: "*New Medical Booking - Siroz Elite*"
        }
    };

    window.onload = function() {
        if (localStorage.getItem('app_wa')) {
            updateUI();
            showPage('bookingPage');
            cleanOldRecords();
        } else {
            showPage('setupPage');
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const html = document.getElementById('htmlTag');
        html.lang = currentLang;
        html.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'العربية';
        document.querySelectorAll('[data-ar]').forEach(el => el.innerText = el.getAttribute(`data-${currentLang}`));
        updateUI();
    }

    function setVisitType(ar, en, btn) {
        visitTypeAr = ar; visitTypeEn = en;
        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function updateUI() {
        document.getElementById('displayClinicName').innerText = (localStorage.getItem('app_name') || "Elite").toUpperCase();
        document.getElementById('pName').placeholder = translations[currentLang].placeholderName;
        document.getElementById('pPhone').placeholder = translations[currentLang].placeholderPhone;

        const cards = [
            { icon: '💆‍♂️', label: translations[currentLang].hair },
            { icon: '✨', label: translations[currentLang].skin },
            { icon: '🦷', label: translations[currentLang].teeth },
            { icon: '🔬', label: translations[currentLang].lab }
        ];

        let html = "";
        cards.forEach(card => {
            html += `<div class="card" onclick="openBookingForm('${card.label}', '${card.icon}')">
                        <div class="icon-circle">${card.icon}</div>
                        <span style="font-weight:700; color: var(--dark-blue);">${card.label}</span>
                    </div>`;
        });
        document.getElementById('cardsContainer').innerHTML = html;
    }

    function openBookingForm(dept, icon) {
        activeDept = dept;
        document.getElementById('selectedDeptName').innerText = icon + " " + dept;
        document.getElementById('patientArea').style.display = 'block';
        document.getElementById('pName').value = "";
        document.getElementById('pPhone').value = "";
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function sendToWhatsApp() {
        const name = document.getElementById('pName').value.trim();
        const phone = document.getElementById('pPhone').value.trim();
        const wa = localStorage.getItem('app_wa');
        const vType = currentLang === 'ar' ? visitTypeAr : visitTypeEn;

        if (!name || !phone) return alert(translations[currentLang].alertFill);

        saveRecord(name, phone, activeDept, vType);

        const msg = `${translations[currentLang].waMsg}%0A` + 
                    `--------------------------%0A` +
                    `*القسم:* ${activeDept}%0A` + 
                    `*الزيارة:* ${vType}%0A` +
                    `*المراجع:* ${name}%0A` + 
                    `*الهاتف:* ${phone}%0A` +
                    `--------------------------`;

        window.open(`https://api.whatsapp.com/send?phone=${wa}&text=${msg}`, '_blank');
    }

    function saveRecord(n, p, d, v) {
        let records = JSON.parse(localStorage.getItem('clinic_records') || '[]');
        records.push({ name: n, phone: p, dept: d, visit: v, date: Date.now() });
        localStorage.setItem('clinic_records', JSON.stringify(records));
    }

    function cleanOldRecords() {
        let records = JSON.parse(localStorage.getItem('clinic_records') || '[]');
        const limit = Date.now() - (365 * 24 * 60 * 60 * 1000);
        localStorage.setItem('clinic_records', JSON.stringify(records.filter(r => r.date > limit)));
    }

    function toggleHistory() {
        const sec = document.getElementById('historySection');
        sec.style.display = sec.style.display === 'block' ? 'none' : 'block';
        if(sec.style.display === 'block') {
            const records = JSON.parse(localStorage.getItem('clinic_records') || '[]');
            document.getElementById('historyList').innerHTML = records.reverse().map(r => `
                <div class="history-item">
                    <span style="color:var(--sky-blue); font-weight:bold;">${r.name}</span>
                    <span style="opacity:0.6">${new Date(r.date).toLocaleDateString()}</span>
                </div>
            `).join('') || "No Records";
        }
    }

    function saveAdminSettings() {
        const name = document.getElementById('clinicNameInput').value.trim();
        let wa = document.getElementById('whatsappInput').value.trim().replace(/\D/g,'');
        if (!name || !wa) return alert("يرجى إكمال الإعدادات");
        localStorage.setItem('app_name', name);
        localStorage.setItem('app_wa', wa);
        location.reload();
    }

    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function resetApp() {
        if(confirm("مسح الإعدادات؟")) { localStorage.clear(); location.reload(); }
    }
</script>

</body>
          </html>
